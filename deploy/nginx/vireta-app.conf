# ---------------------------------------------------------------------------
# ViretaDev — shared location rules
# ---------------------------------------------------------------------------
#
# Every deny rule here has a counterpart in the repo that this file replaces,
# and the comment says which. If you add a deny to an .htaccess, add it here
# too, or the two environments will disagree about what is servable.
#
# The app root is the repository root itself — index.php sits next to
# application/, inc/ and uploads/, so there is no separate public/ directory.
# That is why the deny rules are load-bearing rather than belt-and-braces:
# config.php reads .env from FCPATH, so .env has to be inside the webroot, and
# the only thing keeping it off the internet is the rules below.
# ---------------------------------------------------------------------------

root /var/www/htxvireta;
index index.php;

# PHP uploads and generated PDFs land in these; body size has to allow for a
# generated PDF on the way back out, and for a household photograph on the way
# in.
client_max_body_size 25m;

# --- Anti-Slowloris & DDoS Mitigation Timeouts ------------------------------
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
keepalive_timeout 30s;

# --- Connection & Request Rate Limiting -------------------------------------
limit_conn vireta_conn 25;
limit_req zone=vireta_general burst=30 nodelay;

# Never advertise the backend.
server_tokens off;

access_log /var/log/nginx/vireta.access.log;
error_log  /var/log/nginx/vireta.error.log warn;

# --- .htaccess: any dotfile is denied ---------------------------------------
# (.env, .git, .htpasswd, .npmrc, ...) The repo relies on this and so must we.
# The ^~ prefix is deliberate: it wins over the regex locations below, so this
# cannot be accidentally reordered into a lower priority.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- Security headers --------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

# --- .htaccess: sensitive file types are denied -----------------------------
# Dumps, archives, logs, markdown docs, and local config.
location ~* \.(sql|dump|bak|old|orig|save|swp|log|ini|conf|env|sh|tar|gz|zip|md|lock)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- never serve internal application code, docs, migrations or tooling -----
# Completely hides framework and repository file structure.
location ~ ^/(application|system|vendor|docs|migrations|deploy|resources)/ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- never serve root metadata, rulebooks, or dependency files --------------
location ~* ^/(AGENTS\.md|README\.md|LICENSE|router\.php|dev\.sh|composer\.(json|lock)|package(-lock)?\.json)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- uploads/.htaccess: images only, never executed -------------------------
# This is the important one. A tenant-uploaded file must never run, and the
# repo's own .htaccess says the same thing for the same reason. A prefix match
# beats a regex match in nginx, so this block is consulted before the generic
# \.php$ handler below — which is exactly the precedence Apache gets from
# RemoveHandler plus a nested deny.
location ^~ /uploads/ {
    # Nested: strip the prefix, then apply the same regexes to what remains.
    alias /var/www/htxvireta/uploads/;

    autoindex off;

    # Dotfiles inside uploads too. The ^~ prefix above means the top-level
    # dotfile deny never gets a chance to see these.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Deny script extensions inside uploads.
    location ~* \.(php[0-9]?|phtml|pht|phar|cgi|pl|py|sh|shtml|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # Anything that is not a readable static file falls through to deny rather
    # than being handed to PHP.
    try_files $uri =403;
}

# --- static assets ----------------------------------------------------------
# Let the browser and nginx cache these. portal.css is 90 MB worth of
# repository but the served file is small; the mtime+size check means an
# edited build is picked up without a hard refresh.
location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
}

# --- front controller -------------------------------------------------------
# Apache's rule was: forward to index.php only if the file does not exist.
# Same here. This is what makes every CI3 route work, and it is why the deny
# rules above must be explicit.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# --- PHP --------------------------------------------------------------------
# try_files inside this block is the difference between a 404 and remote code
# execution. Without it, /uploads/anything.php would reach fastcgi_pass if the
# uploads deny were ever removed or mistyped, because the location regex
# matches anywhere in the URI. With it, only a real file on disk is passed on.
location ~ \.php$ {
    try_files $uri =404;

    include fastcgi_params;

    fastcgi_pass  vireta_php;
    fastcgi_index index.php;

    # mPDF and the PDF rasteriser need memory and time; the default 60s is not
    # enough for a large holding-tax certificate, and the default buffer is
    # small enough to truncate a base64 logo on the way through.
    fastcgi_read_timeout 180s;
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;

    # CI3 reports the path in its output, and a fatal is a blank page with the
    # reason in a header. Never expose that to a visitor.
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}
