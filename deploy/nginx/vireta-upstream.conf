# ---------------------------------------------------------------------------
# ViretaDev — nginx + PHP-FPM
# ---------------------------------------------------------------------------
#
# This replaces the Apache setup. It is not optional: nginx ignores .htaccess
# entirely, so every deny rule in the repo's .htaccess and uploads/.htaccess
# has to be re-stated here or the site starts serving .env and executes PHP out
# of uploads/. All three blocks below exist for that reason and are not tidy-up.
#
# Before installing:
#   1. Replace every PLACEHOLDER below.
#   2. Get TLS first — certbot needs the vhost answering on 80 to complete
#      the HTTP-01 challenge, so install this file, then run certbot, then
#      re-run certbot to add TLS to the two HTTPS server blocks.
#   3. Wildcard subdomains need a WILDCARD certificate. A single cert for
#      viretaup.com does not cover dhum.viretaup.com. See deploy/DEPLOY.md.
#
# nginx -t before every reload. A bad config here takes the whole site down.
# ---------------------------------------------------------------------------

# FastCGI is shared by every vhost, so the security rules live with the app
# root rather than in each server block.
upstream vireta_php {
    server unix:/run/php/php8.3-fpm.sock;

    # The built-in dev server is single-threaded and serialises everything.
    # A parishad portal is not load-heavy, but 8 workers is still the floor:
    # a slow PDF (mPDF) must not block a visitor's home page.
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name PLACEHOLDER_PLATFORM_DOMAIN www.PLACEHOLDER_PLATFORM_DOMAIN;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- platform site (the product landing page) ------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name PLACEHOLDER_PLATFORM_DOMAIN www.PLACEHOLDER_PLATFORM_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PLACEHOLDER_PLATFORM_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLACEHOLDER_PLATFORM_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/vireta-app.conf;
}

# --- tenant apex + every subdomain ------------------------------------------
# One vhost serves <slug>.viretaup.com for every parishad. The app itself
# decides which tenant a host belongs to (Tenant_resolver), so nginx must not
# try: a single wildcard server_name is the correct shape here, and adding a
# new tenant must never require an nginx reload.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name PLACEHOLDER_TENANT_APEX *.PLACEHOLDER_TENANT_APEX;

    ssl_certificate     /etc/letsencrypt/live/PLACEHOLDER_TENANT_APEX/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLACEHOLDER_TENANT_APEX/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/vireta-app.conf;
}
