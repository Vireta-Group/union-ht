name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # স্তর ১: আগের আপলোডের state ফাইল ক্যাশ থেকে ফিরিয়ে আনা
      - name: Restore FTP sync state
        uses: actions/cache@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.run_id }}
          restore-keys: ftp-sync-

      # স্তর ২: শুধু পরিবর্তিত ফাইল আপলোড
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git/**
            **/.github/**
            **/.env
            **/.env.*
            **/docs/**
            **/deploy/**
            **/application/logs/**
            **/application/cache/**
            **/uploads/tenant-*/**
            **/vendor/**
            **/inc/assets/vendor/**

      - name: Verify Deployment
        run: |
          echo "FTP Deployment complete. Verifying site health..."
          curl -sS -o /dev/null -w "Response Code: %{http_code}\n" https://dhumup.com/
