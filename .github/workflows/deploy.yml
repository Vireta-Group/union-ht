name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps # Use ftps for security, fallback to ftp if needed
          local-dir: ./
          server-dir: /public_html/ # Change this to /public_html/ht/ if your app is in a subfolder
          dangerous-clean-slate: false
          exclude: |
            **/.git/**
            **/.github/**
            **/.env
            **/.env.*
            **/docs/**
            **/deploy/**
            **/application/logs/**
            **/application/cache/**
            **/uploads/tenant-*/**

      - name: Verify Deployment
        run: |
          echo "FTP Deployment complete. Verifying site health..."
          curl -sS -o /dev/null -w "Response Code: %{http_code}\n" https://dhumup.com/
